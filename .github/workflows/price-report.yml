name: price-report

on:
  workflow_dispatch:
  # schedule 块已注释：先禁用 GitHub Actions 定时任务，改用本地调度
  # schedule:
  #   - cron: '*/30 * * * *'

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: CI contract check
        run: bash scripts/check-ci.sh

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Run tests
        working-directory: server
        run: npm test

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - name: Run price report (single shot)
        working-directory: server
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Shanghai' }}
        run: node dist/index.js